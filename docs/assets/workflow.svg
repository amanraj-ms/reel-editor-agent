<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Reel Editor: from your footage to an approved reel</title>
  <desc id="desc">Six numbered stages: share media, review usable scenes, analyze a reference, approve the idea, render locally, and verify and deliver. Missing footage and material revisions return to review. Creative approval is required before rendering.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101a35"/>
      <stop offset="1" stop-color="#202044"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#a8b8dc" stroke-width="1.5"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .heading{font-size:21px;font-weight:700;fill:#f4f7ff}
      .body{font-size:16px;fill:#c3cee6}
      .step{font-size:15px;font-weight:700}
      .connector{fill:none;stroke:#a8b8dc;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="570" rx="24" fill="url(#background)"/>
  <text x="44" y="52" fill="#a5b4fc" font-size="14" font-weight="700" letter-spacing="3">REEL EDITOR / COPILOT WORKFLOW</text>
  <text x="44" y="98" fill="#ffffff" font-size="34" font-weight="700">Your footage. A real edit. Your approval.</text>
  <text x="44" y="129" class="body">Local media tools + assistant-led editorial judgment + measurable checks.</text>

  <rect x="44" y="158" width="344" height="137" rx="16" fill="#142d47" stroke="#38bdf8" stroke-opacity=".6"/>
  <text x="66" y="190" class="step" fill="#7dd3fc">01 / SHARE</text>
  <text x="66" y="221" class="heading">Bring your own media</text>
  <text x="66" y="250" class="body">Photos, videos or a local folder.</text>
  <text x="66" y="275" class="body">Original files remain unchanged.</text>

  <rect x="428" y="158" width="344" height="137" rx="16" fill="#123432" stroke="#2dd4bf" stroke-opacity=".6"/>
  <text x="450" y="190" class="step" fill="#5eead4">02 / REVIEW</text>
  <text x="450" y="221" class="heading">Find the usable story</text>
  <text x="450" y="250" class="body">Inspect scenes, motion and crops.</text>
  <text x="450" y="275" class="body">Enough for a draft? Say why.</text>

  <rect x="812" y="158" width="344" height="137" rx="16" fill="#2b2348" stroke="#a78bfa" stroke-opacity=".7"/>
  <text x="834" y="190" class="step" fill="#c4b5fd">03 / REFERENCE</text>
  <text x="834" y="221" class="heading">Understand the style</text>
  <text x="834" y="250" class="body">Review pacing, text and framing.</text>
  <text x="834" y="275" class="body">Confirm soundtrack permission.</text>

  <path d="M390 225H420" class="connector"/>
  <path d="M774 225H804" class="connector"/>
  <path d="M984 297V313H216V331" class="connector"/>

  <rect x="44" y="338" width="344" height="137" rx="16" fill="#3b2b24" stroke="#fbbf24" stroke-opacity=".8"/>
  <text x="66" y="370" class="step" fill="#fcd34d">04 / APPROVAL GATE</text>
  <text x="66" y="401" class="heading">Agree on the edit idea</text>
  <text x="66" y="430" class="body">Scene order, timing and coverage.</text>
  <text x="66" y="455" class="body">Wait for your explicit approval.</text>

  <rect x="428" y="338" width="344" height="137" rx="16" fill="#302141" stroke="#e879f9" stroke-opacity=".6"/>
  <text x="450" y="370" class="step" fill="#f0abfc">05 / EDIT</text>
  <text x="450" y="401" class="heading">Render locally</text>
  <text x="450" y="430" class="body">FFmpeg executes the shot plan.</text>
  <text x="450" y="455" class="body">New version, never an overwrite.</text>

  <rect x="812" y="338" width="344" height="137" rx="16" fill="#193429" stroke="#4ade80" stroke-opacity=".6"/>
  <text x="834" y="370" class="step" fill="#86efac">06 / VERIFY</text>
  <text x="834" y="401" class="heading">Inspect before delivery</text>
  <text x="834" y="430" class="body">Frames, audio, decode, crops, fades.</text>
  <text x="834" y="455" class="body">MP4 + preview + plan + report.</text>

  <path d="M390 405H420" class="connector"/>
  <path d="M774 405H804" class="connector"/>
  <rect x="44" y="501" width="1112" height="42" rx="10" fill="#0c142b"/>
  <text x="64" y="528" class="body">Need more footage or a material redesign? Return to review and approve the revised concept.</text>
</svg>
